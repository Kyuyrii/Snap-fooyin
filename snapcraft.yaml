name: fooyin
base: core24
version: '0.15.1'
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
summary: A customisable music player
description: |
 fooyin is a music player built around customisation.
 It provides a variety of widgets to help you manage and play your local collection.
 It's highly extensible with a plugin system and includes FooScript, a scripting language for advanced configuration of widgets.
grade: stable
confinement: strict
icon: org.fooyin.fooyin.svg

apps:
  fooyin:
    command: usr/bin/fooyin
    desktop: usr/share/applications/org.fooyin.fooyin.desktop
    common-id: org.fooyin.fooyin
    environment:
      QT_QPA_PLATFORMTHEME: xdgdesktopportal
    extensions: [kde-neon-6]
    plugs:
      - home
      - removable-media
      - mount-observe
      - udisks2
      - optical-drive
    slots: [mpris]

plugs:
  shared-memory:
    private: true

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
  /usr/share/alsa:
    symlink: $SNAP/usr/share/alsa

parts:
  fooyin-app:
    plugin: dump
    source:
      - on amd64: https://github.com/fooyin/fooyin/releases/download/v$SNAPCRAFT_PROJECT_VERSION/fooyin_$SNAPCRAFT_PROJECT_VERSION-noble_amd64.deb
      - on arm64: https://github.com/fooyin/fooyin/releases/download/v$SNAPCRAFT_PROJECT_VERSION/fooyin_$SNAPCRAFT_PROJECT_VERSION-noble_arm64.deb
    override-build: |
      craftctl default
      sed -i 's|Name=fooyin|Name=fooyin [Kyu]|' $CRAFT_PART_INSTALL/usr/share/applications/org.fooyin.fooyin.desktop

  dependencies:
    after: [fooyin-app]
    plugin: nil
    stage-packages:
      - libsdl2-2.0-0
      - libopusfile0
      - libsoundtouch1
      - libqcoro6core0t64
      - libqcoro6network0t64
      - libcdio19t64
      - libcdio-cdda2t64
      - libcdio-paranoia2t64
      - libjack0
      - libavfilter9
      - libasound2t64
      - libasound2-plugins

  kf6-cleanup:
    after: [dependencies]
    plugin: nil
    source: https://github.com/canonical/gpu-snap.git
    build-snaps:
    - kf6-core24
    - gtk-common-themes
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404
      set -eux
      for snap in "kf6-core24" "gtk-common-themes"; do
          cd "/snap/$snap/current" && find . -type f,l \( -name "*.so.*" -o -name "*.so" \) -exec rm -f "$CRAFT_PRIME/{}" \;
      done
